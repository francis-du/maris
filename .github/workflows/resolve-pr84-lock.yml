name: Resolve PR 84 security lock
on:
  pull_request:
    paths:
      - '.github/workflows/resolve-pr84-lock.yml'
permissions:
  contents: read
jobs:
  resolve:
    if: github.event.pull_request.number == 84
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.94.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Generate the security patch lock with Cargo
        run: |
          set -euo pipefail
          cargo update -p rustls --precise 0.23.46
          cargo update -p rustls-webpki --precise 0.103.16
          cargo update -p webpki-roots --precise 1.0.10
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --check
          git diff --stat -- Cargo.lock
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          content = Path('Cargo.lock').read_bytes()
          print('MARIS_GENERATED_LOCK_SHA256=' + hashlib.sha256(content).hexdigest())
          encoded = base64.b64encode(content).decode('ascii')
          print('MARIS_GENERATED_LOCK_BEGIN')
          for start in range(0, len(encoded), 100):
              print(encoded[start:start + 100])
          print('MARIS_GENERATED_LOCK_END')
          PY
