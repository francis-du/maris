name: Refresh native menu docs

on:
  push:
    branches:
      - release/0.1.0-final

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal && rustup override set 1.94.0
      - name: Refresh actual offline AppKit menu captures
        run: python scripts/capture_menu_docs.py --refresh
      - name: Validate refreshed native menu assets
        run: python scripts/capture_menu_docs.py
      - name: Commit only generated native menu assets and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -eq 3
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              docs/assets/menu-bar-en.svg|docs/assets/menu-bar-zh-CN.svg|docs/assets/menu-bar-review-manifest.json) ;;
              *) echo "Unexpected native-menu generated change: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/menu-bar-en.svg docs/assets/menu-bar-zh-CN.svg docs/assets/menu-bar-review-manifest.json
          git rm .github/workflows/refresh-native-menu-docs.yml
          git commit -m "docs: refresh native Menu Bar captures"
          git push origin HEAD:release/0.1.0-final
