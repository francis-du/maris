name: Release 0.1.0 preflight normalize

on:
  push:
    branches:
      - release/0.1.0-final

permissions:
  contents: write

jobs:
  normalize-and-linux-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy && rustup override set 1.94.0
      - name: Install Linux audio build headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config psmisc pulseaudio pulseaudio-utils
      - name: Normalize Rust formatting
        run: cargo fmt --all
      - name: Regenerate actual offline TUI documentation assets
        env:
          TERM: xterm-256color
          COLORTERM: truecolor
          MARIS_REDUCED_MOTION: '0'
        run: |
          python scripts/docs_assets.py --refresh
          python scripts/docs_assets.py
      - name: Source and documentation contract
        run: |
          python scripts/source_audit.py
          python scripts/site.py --check
          python -m unittest discover -s tests/tooling -v
          bash -n install.sh
          bash -n scripts/install_linux.sh
          bash -n scripts/install_macos.sh
          bash install.sh --dry-run
      - name: Default feature regression
        run: cargo test --all-targets --locked
      - name: Minimal feature regression
        run: cargo test --all-targets --no-default-features --locked
      - name: Strict clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Offline UI and native menu construction
        run: |
          cargo run --locked --example ui_probe -- --locales
          cargo run --locked --example menu_probe -- --locales
      - name: Commit only normalized source/generated UI assets and self-remove
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              *.rs|docs/assets/studio-*.svg|docs/assets/settings-*.svg|docs/assets/presets-*.svg|docs/assets/illustrations.json) ;;
              *) echo "Unexpected preflight-generated change: $path" >&2; exit 1 ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' docs/assets/studio-*.svg docs/assets/settings-*.svg docs/assets/presets-*.svg docs/assets/illustrations.json
          git rm .github/workflows/release-010-preflight.yml
          if ! git diff --cached --quiet; then
            git commit -m "release: normalize 0.1.0 candidate"
            git push origin HEAD:release/0.1.0-final
          fi
