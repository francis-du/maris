name: Documentation Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/0.1.0-final
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install declared Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.94.0
      - name: Generate final TUI and native Menu Bar assets
        run: |
          python scripts/docs_assets.py --refresh
          python scripts/capture_menu_docs.py --refresh
          python scripts/docs_assets.py
          python scripts/capture_menu_docs.py
      - name: Restore production Pages workflow and validate generated site
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/pages.yml
          python scripts/site.py --check
          python -m unittest discover -s tests/tooling -v
      - name: Commit only generated documentation assets
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/pages.yml|docs/assets/studio-*.svg|docs/assets/settings-*.svg|docs/assets/presets-*.svg|docs/assets/illustrations.json|docs/assets/menu-bar-en.svg|docs/assets/menu-bar-zh-CN.svg|docs/assets/menu-bar-review-manifest.json) ;;
              *) echo "Unexpected generated change: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pages.yml docs/assets/studio-*.svg docs/assets/settings-*.svg docs/assets/presets-*.svg docs/assets/illustrations.json docs/assets/menu-bar-en.svg docs/assets/menu-bar-zh-CN.svg docs/assets/menu-bar-review-manifest.json
          git commit -m "docs: refresh final 0.1.0 UI assets"
          git push origin HEAD:release/0.1.0-final
