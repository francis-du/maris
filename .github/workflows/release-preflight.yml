name: Release 0.1.0 preflight

on:
  push:
    branches:
      - release/0.1.0-final
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-0.1.0-preflight
  cancel-in-progress: true

jobs:
  platform-code:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: \${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: runner.os == 'Linux' || runner.os == 'Windows'
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Install Linux audio build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config psmisc pulseaudio pulseaudio-utils
      - name: Source/docs and installer audit
        if: runner.os == 'Linux'
        run: |
          python scripts/source_audit.py
          python scripts/site.py --check
          python -m unittest discover -s tests/tooling -v
          bash -n install.sh
          bash -n scripts/install_linux.sh
          bash -n scripts/install_macos.sh
          bash install.sh --dry-run
      - name: Native Windows download regression
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests/tooling -p test_online.py -v
      - name: Reject vulnerable dependencies reachable on this target
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree --locked --edges normal)"
          if grep -Eq '(^|[[:space:]├└─])glib v0\.18\.5([[:space:]]|$)' <<< "$tree"; then
            echo "glib 0.18.5 is reachable on $RUNNER_OS" >&2
            exit 1
          fi
          if grep -Eq '(^|[[:space:]├└─])ringbuf v0\.[0-4]\.' <<< "$tree"; then
            echo "unpatched ringbuf is reachable on $RUNNER_OS" >&2
            exit 1
          fi
      - name: Formatting
        run: cargo fmt --all --check
      - name: Default feature regression
        run: cargo test --all-targets --locked
      - name: Minimal feature regression
        run: cargo test --all-targets --no-default-features --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Target 0.1.0 release blockers explicitly
        shell: bash
        run: cargo test --locked --test music --test scenes --test presets --test menu_configuration --test terminal_input --test tui --test config_layout --test config_interaction --test studio_controls
      - name: Exercise native menu event delivery and bounded shutdown
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: cargo run --locked --example menu_probe -- --event-loop
      - name: Execute the pinned local music model
        env:
          MARIS_BUNDLE_SMALL_MODELS: '1'
        run: cargo test --locked --lib models:: -- --nocapture
      - name: Native Linux audio integration with private silent outputs
        if: runner.os == 'Linux'
        run: python3 tests/support/pulse_smoke.py --binary target/debug/maris

  finalize-doc-assets:
    needs: platform-code
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/0.1.0-final
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install declared Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.94.0
      - name: Generate final TUI and native Menu Bar documentation assets
        run: |
          python scripts/docs_assets.py --refresh
          python scripts/capture_menu_docs.py --refresh
          python scripts/docs_assets.py
          python scripts/capture_menu_docs.py
          python scripts/site.py --check
          python -m unittest discover -s tests/tooling -v
      - name: Commit only generated documentation assets and remove preflight workflow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              docs/assets/studio-*.svg|docs/assets/settings-*.svg|docs/assets/presets-*.svg|docs/assets/illustrations.json|docs/assets/menu-bar-en.svg|docs/assets/menu-bar-zh-CN.svg|docs/assets/menu-bar-review-manifest.json) ;;
              *) echo "Unexpected generated change: $path" >&2; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -ge 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/studio-*.svg docs/assets/settings-*.svg docs/assets/presets-*.svg docs/assets/illustrations.json docs/assets/menu-bar-en.svg docs/assets/menu-bar-zh-CN.svg docs/assets/menu-bar-review-manifest.json
          git rm .github/workflows/release-preflight.yml
          git commit -m "docs: refresh final 0.1.0 UI assets"
          git push origin HEAD:release/0.1.0-final
