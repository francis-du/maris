name: One-time dependency lock refresh
on:
  push:
    branches: [fix/consolidate-cpal-tao]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust and Linux audio headers
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - name: Regenerate lock and validate Linux compile
        run: |
          cargo +1.94.0 fmt --all --check
          cargo +1.94.0 check --all-targets
          cargo +1.94.0 check --locked --all-targets --no-default-features
      - name: Commit Cargo.lock once
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Refresh lockfile for cpal and tao updates"
          git push
