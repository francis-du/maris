name: Refresh native menu documentation

on:
  push:
    branches:
      - 'docs-refresh/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-menu-docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: 1.94.0

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the exact trigger source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Capture isolated production AppKit menu views
        run: python scripts/capture_menu_docs.py --refresh --output-dir .maris-review/refreshed-menu-docs
      - name: Preserve generated illustrations and their native capture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-menu-docs-${{ github.sha }}
          path: |
            .maris-review/refreshed-menu-docs/
            .maris-review/menu-review.json
            .maris-review/native-menu/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

# Generated assets require review and a normal source commit. This workflow
# never updates Git refs, publishes a release or changes the site validation gates.
