name: Normalize 0.1.0 candidate

on:
  push:
    branches:
      - release/0.1.0-final

permissions:
  contents: write

concurrency:
  group: 0.1.0-candidate-normalize
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt
      - name: Normalize Rust formatting
        run: cargo fmt --all
      - name: Verify actual TUI probe before generating docs
        run: cargo run --locked --example ui_probe -- --locales
      - name: Regenerate final TUI documentation assets
        run: python scripts/docs_assets.py --refresh
      - name: Regenerate actual offline AppKit Menu Bar documentation
        run: python scripts/capture_menu_docs.py --refresh
      - name: Validate source/docs and formatting
        run: |
          cargo fmt --all --check
          python scripts/docs_assets.py
          python scripts/capture_menu_docs.py
          python scripts/source_audit.py
          python scripts/site.py --check
          python -m unittest discover -s tests/tooling -v
          git diff --check
      - name: Commit only normalization outputs and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              *.rs|docs/assets/studio-*.svg|docs/assets/settings-*.svg|docs/assets/presets-*.svg|docs/assets/illustrations.json|docs/assets/menu-bar-*.svg|docs/assets/menu-bar-review-manifest.json) ;;
              *) echo "Unexpected normalize change: $path" >&2; exit 1 ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' docs/assets/studio-*.svg docs/assets/settings-*.svg docs/assets/presets-*.svg docs/assets/illustrations.json docs/assets/menu-bar-*.svg docs/assets/menu-bar-review-manifest.json
          git rm .github/workflows/release-candidate-normalize.yml
          if git diff --cached --quiet; then
            echo "No normalization changes to commit" >&2
            exit 1
          fi
          git commit -m "preflight: normalize 0.1.0 candidate"
          git push origin HEAD:release/0.1.0-final
