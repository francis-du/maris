name: Consolidate PR 11 dependencies once
on:
  push:
    branches: [fix/windows-ci-and-dependency-updates]
    paths: [.github/workflows/pr11-consolidate-once.yml]
permissions:
  contents: read
concurrency:
  group: pr11-dependency-consolidation
  cancel-in-progress: false
jobs:
  consolidate:
    if: >-
      github.repository == 'francis-du/maris' && github.ref == 'refs/heads/fix/windows-ci-and-dependency-updates' && github.event.head_commit.message == 'Prepare one-time dependency consolidation for PR #11'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install build tools
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - name: Apply reviewed dependency migrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != count:
                  raise SystemExit(f'Unexpected source shape: {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace('Cargo.toml', 'ratatui = "0.29"', 'ratatui = "0.30.2"')
          replace('Cargo.toml', 'crossterm = "0.28"', 'crossterm = "0.29"')
          replace('Cargo.toml', 'sha2 = "0.10"', 'sha2 = "0.11"', 2)
          replace('Cargo.toml', 'schemars = "1.2"', 'schemars = "1.2.2"')
          replace('Cargo.toml', 'ureq = "3.4"', 'ureq = "3.4.2"')
          for section in ('[build-dependencies]', '[dev-dependencies]'):
              replace('Cargo.toml', section, section + '\nhex = "0.4"')
          for path, expression in [('build.rs', 'bytes'), ('build.rs', '&pack'),
                                   ('tests/unit/model_cache.rs', 'bytes')]:
              replace(path, 'format!("{:x}", Sha256::digest(' + expression + '))',
                      'hex::encode(Sha256::digest(' + expression + '))')
          for path, expected in [('src/control/mcp.rs', 7), ('src/cli/mod.rs', 1),
                                 ('src/cli/sound.rs', 1)]:
              p = Path(path)
              text, count = re.subn(r'schemars::schema_for!\(([^()]+)\)',
                  lambda m: 'schemars::generate::SchemaSettings::draft07().into_generator().into_root_schema_for::<' + m[1] + '>()',
                  p.read_text(encoding='utf-8'))
              if count != expected:
                  raise SystemExit(f'Unexpected schema call count in {path}: {count}')
              p.write_text(text, encoding='utf-8', newline='\n')
          test = Path('tests/dependency_schema.rs')
          if test.exists():
              raise SystemExit('Refusing to overwrite an existing test')
          test.write_text(r'''use maris::{mcp, store::Store};
          use serde_json::{json, Value};
          use std::io::Cursor;

          fn check_references(value: &Value, root: &Value) -> usize {
              match value {
                  Value::Object(fields) => {
                      let mut count = 0;
                      if let Some(reference) = fields.get("$ref").and_then(Value::as_str) {
                          let pointer = reference.strip_prefix('#').expect("local schema reference");
                          assert!(root.pointer(pointer).is_some(), "unresolved schema reference: {reference}");
                          count += 1;
                      }
                      count + fields.values().map(|v| check_references(v, root)).sum::<usize>()
                  }
                  Value::Array(values) => values.iter().map(|v| check_references(v, root)).sum(),
                  _ => 0,
              }
          }

          #[test]
          fn dependency_updates_preserve_schema_dialect_and_nested_references() {
              let directory = tempfile::tempdir().unwrap();
              let store = Store::at(directory.path());
              let requests = [
                  json!({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"schema-test","version":"1"}}}),
                  json!({"jsonrpc":"2.0","method":"notifications/initialized"}),
                  json!({"jsonrpc":"2.0","id":2,"method":"tools/list"}),
              ].iter().map(Value::to_string).collect::<Vec<_>>().join("\n") + "\n";
              for allow_write in [false, true] {
                  let mut output = Vec::new();
                  mcp::serve_io(&store, allow_write, &mut Cursor::new(&requests), &mut output).unwrap();
                  let response: Value = serde_json::from_str(String::from_utf8(output).unwrap().lines().last().unwrap()).unwrap();
                  let tools = response["result"]["tools"].as_array().unwrap();
                  let mut references = 0;
                  for tool in tools {
                      let schema = &tool["inputSchema"];
                      assert_eq!(schema["type"], "object", "{}", tool["name"]);
                      references += check_references(schema, schema);
                  }
                  assert!(references > 0, "schemas lost their nested types");
              }
              for tool in ["maris_schema", "maris_music_schema"] {
                  let schema = mcp::invoke(&store, tool, json!({}), false).unwrap();
                  assert_eq!(schema["$schema"], "http://json-schema.org/draft-07/schema#");
                  assert!(check_references(&schema, &schema) > 0);
              }
              assert!(!directory.path().join("control.json").exists());
          }
          ''', encoding='utf-8', newline='\n')
          PY
          rustfmt --edition 2021 build.rs src/control/mcp.rs src/cli/mod.rs src/cli/sound.rs tests/unit/model_cache.rs tests/dependency_schema.rs
          cargo update --workspace
      - name: Verify generated lockfile and adapters
        run: |
          cargo check --all-targets --locked
          cargo test --locked --test dependency_schema --test protocol --test tui
          cargo fmt --all --check
      - name: Commit only the reviewed files to PR 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess, tomllib, urllib.request
          repo = 'francis-du/maris'
          branch = 'fix/windows-ci-and-dependency-updates'
          if os.environ['GITHUB_REPOSITORY'] != repo or os.environ['GITHUB_REF'] != 'refs/heads/' + branch:
              raise SystemExit('Unexpected repository or branch')
          base = os.environ['GITHUB_SHA']
          files = ['Cargo.toml', 'Cargo.lock', 'build.rs', 'src/control/mcp.rs',
                   'src/cli/mod.rs', 'src/cli/sound.rs', 'tests/unit/model_cache.rs',
                   'tests/dependency_schema.rs']
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if not changed.issubset(files):
              raise SystemExit('Unexpected changes: ' + ', '.join(changed - set(files)))
          lock = tomllib.loads(Path('Cargo.lock').read_text())
          packages = {(p['name'], p['version']) for p in lock['package']}
          for pair in [('ratatui', '0.30.2'), ('sha2', '0.11.0'), ('crossterm', '0.29.0'),
                       ('cpal', '0.16.0'), ('schemars', '1.2.2'), ('ureq', '3.4.2')]:
              if pair not in packages:
                  raise SystemExit('Missing requested version: ' + repr(pair))
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'User-Agent': 'Maris-PR11-Consolidation'}
          def api(path, data=None, method=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if data is None else json.dumps(data).encode(), headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          if api('/git/ref/heads/' + branch)['object']['sha'] != base:
              raise SystemExit('Branch moved; refusing to overwrite concurrent work')
          original = api('/git/commits/' + base)
          tree = api('/git/trees', {'base_tree': original['tree']['sha'], 'tree': [
              {'path': p, 'mode': '100644', 'type': 'blob', 'content': Path(p).read_text(encoding='utf-8')}
              for p in files]})
          commit = api('/git/commits', {'message': 'Consolidate ratatui and sha2 updates with compatible schema and digest adapters',
                                      'tree': tree['sha'], 'parents': [base]})
          api('/git/refs/heads/' + branch, {'sha': commit['sha'], 'force': False}, method='PATCH')
          print('Consolidated PR #5 and #10 into PR #11 at ' + commit['sha'])
          PY
