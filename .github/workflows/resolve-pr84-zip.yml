name: Validate the ZIP compatibility backport
on:
  pull_request:
    paths:
      - '.github/workflows/resolve-pr84-zip.yml'
permissions:
  contents: read
jobs:
  zip-compatibility:
    if: github.event.pull_request.number == 84
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.94.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt
      - name: Prepare the checksum-verified Candle 0.11.0 compatibility backport
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          from pathlib import Path, PurePosixPath
          import tarfile
          import urllib.request
          
          root = Path.cwd()
          def fetch(url, limit):
              request = urllib.request.Request(url, headers={'User-Agent': 'Maris-dependency-review'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  value = response.read(limit + 1)
              if len(value) > limit:
                  raise ValueError('Download exceeded fixed size bound')
              return value
          
          payload = fetch('https://crates.io/api/v1/crates/candle-core/0.11.0/download', 16 * 1024 * 1024)
          assert hashlib.sha256(payload).hexdigest() == '5ecb245093b0f791b89d3420c3df9c6d49c60ab63ba54db896bf8a3baf486706'
          destination = root / 'third_party/candle-core'
          destination.mkdir(parents=True, exist_ok=False)
          original = {}
          omitted = []
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or path.parts[0] != 'candle-core-0.11.0':
                      raise ValueError('Unexpected crate member path')
                  if member.isdir():
                      continue
                  if not member.isfile() or member.size > 2_000_000:
                      raise ValueError('Unsupported or oversized crate member')
                  relative = PurePosixPath(*path.parts[1:])
                  if relative.as_posix() == 'Cargo.lock':
                      omitted.append(relative.as_posix())
                      continue
                  value = archive.extractfile(member).read(2_000_001)
                  if len(value) != member.size:
                      raise ValueError('Truncated crate member')
                  try:
                      value.decode('utf-8')
                  except UnicodeDecodeError:
                      omitted.append(relative.as_posix())
                      continue
                  target = destination.joinpath(*relative.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(value)
                  original[relative.as_posix()] = hashlib.sha256(value).hexdigest()
          
          for name, expected in {
              'LICENSE-APACHE': '261eeb9e9f8b2b4b0d119366dda99c6fd7d35c64',
              'LICENSE-MIT': '31aa79387f27e730e33d871925e152e35e428031',
          }.items():
              value = fetch('https://raw.githubusercontent.com/huggingface/candle/31f35b147389700ed2a178ee66a91c3cc25cc80d/' + name, 32_000)
              identity = hashlib.sha1(b'blob ' + str(len(value)).encode() + b'\0' + value).hexdigest()
              assert identity == expected
              (destination / name).write_bytes(value)
          
          def replace_once(path, old, new, count=1):
              content = path.read_text(encoding='utf-8')
              if content.count(old) != count:
                  raise ValueError('Patch precondition changed: ' + str(path))
              path.write_text(content.replace(old, new), encoding='utf-8')
          
          replace_once(destination / 'Cargo.toml', '[dependencies.zip]\nversion = "8.6.0"', '[dependencies.zip]\nversion = "=9.0.3"')
          with (destination / 'Cargo.toml').open('a', encoding='utf-8') as output:
              output.write('\n[workspace]\n')
          replace_once(destination / 'src/npy.rs', 'let name = reader.name();', 'let name = reader.name()?;')
          replace_once(destination / 'src/npy.rs', 'let name = file.name();', 'let name = file.name()?;')
          replace_once(destination / 'src/npy.rs', 'name.strip_suffix(NPY_SUFFIX).unwrap_or(name).to_owned()', 'name.strip_suffix(NPY_SUFFIX).unwrap_or(&name).to_owned()', 2)
          replace_once(destination / 'src/pickle.rs',
              '.map(|f| f.to_string())\n        .collect::<Vec<String>>();',
              '.map(|f| f.map(|f| f.to_string()))\n        .collect::<std::result::Result<Vec<String>, _>>()?;')
          changed = [name for name, digest in original.items()
                     if hashlib.sha256((destination / name).read_bytes()).hexdigest() != digest]
          assert set(changed) == {'Cargo.toml', 'src/npy.rs', 'src/pickle.rs'}, changed
          replace_once(root / 'Cargo.toml', '[patch.crates-io]\n',
              '[patch.crates-io]\ncandle-core = { path = "third_party/candle-core" }\n')
          replace_once(root / 'scripts/source_audit.py',
              '"third_party/gemm-common/", "third_party/rust-notices/",',
              '"third_party/gemm-common/", "third_party/candle-core/", "third_party/rust-notices/",')
          
          (destination / 'MARIS_PATCH.md').write_text("# Maris ZIP 9 compatibility backport\n\nThis directory is based on the published candle-core 0.11.0 crate, not Candle's unreleased main branch.\n\n- Published crate SHA-256: 5ecb245093b0f791b89d3420c3df9c6d49c60ab63ba54db896bf8a3baf486706\n- Release source: https://github.com/huggingface/candle/tree/31f35b147389700ed2a178ee66a91c3cc25cc80d\n- Compatibility change reviewed from upstream PR https://github.com/huggingface/candle/pull/4041 at 70f72e9cfdbfc570846ca363ead2135394af3e9a (still unmerged when backported).\n- Licenses: MIT OR Apache-2.0; both upstream license texts are retained.\n\nThe production changes are limited to the ZIP 9 fallible filename API in src/npy.rs and src/pickle.rs. The normalized manifest pins ZIP 9.0.3 and declares a standalone workspace so upstream development targets do not become members of the application's workspace. Other imported production source bytes are unchanged from the verified crate. Binary upstream test fixtures and the upstream Cargo.lock are not part of this dependency snapshot; all UTF-8 source, test, example, benchmark and documentation files are retained.\n\nThis removes the ZIP 8 dependency responsible for RUSTSEC-2026-0367, RUSTSEC-2026-0368 and RUSTSEC-2026-0369 without importing unrelated unreleased tensor/backend changes. Application regression tests cover UTF-8 and CP437 NPZ names, eager/lazy tensor values and malformed NPZ/PTH errors. Native CI, model execution and cargo audit remain required; this patch does not provide physical audio acceptance.\n", encoding='utf-8')
          (root / 'tests/model_zip.rs').write_text("use candle_core::npy::NpzTensors;\nuse candle_core::{Device, Error, Result, Tensor};\nuse std::path::Path;\n\nfn write_tensor(path: &Path, name: &str) -> Result<()> {\n    let tensor = Tensor::new(&[2u32, 4, 6], &Device::Cpu)?;\n    Tensor::write_npz(&[(name, &tensor)], path)?;\n    Ok(())\n}\n\nfn assert_tensor(path: &Path, name: &str) -> Result<()> {\n    let loaded = Tensor::read_npz(path)?;\n    assert_eq!(loaded.len(), 1);\n    assert_eq!(loaded[0].0, name);\n    assert_eq!(loaded[0].1.to_vec1::<u32>()?, vec![2, 4, 6]);\n    let lazy = NpzTensors::new(path)?;\n    assert_eq!(\n        lazy.names().iter().map(|value| value.as_str()).collect::<Vec<_>>(),\n        vec![name]\n    );\n    assert_eq!(\n        lazy.get(name)?.expect(\"named tensor is indexed\").to_vec1::<u32>()?,\n        vec![2, 4, 6]\n    );\n    Ok(())\n}\n\n#[test]\nfn zip9_npz_preserves_utf8_names_and_tensor_values() -> Result<()> {\n    let directory = tempfile::tempdir()?;\n    let path = directory.path().join(\"utf8.npz\");\n    write_tensor(&path, \"donn\\u{e9}es\")?;\n    assert_tensor(&path, \"donn\\u{e9}es\")\n}\n\n#[test]\nfn zip9_npz_preserves_owned_cp437_names_and_tensor_values() -> Result<()> {\n    let directory = tempfile::tempdir()?;\n    let path = directory.path().join(\"cp437.npz\");\n    write_tensor(&path, \"a\")?;\n    let mut bytes = std::fs::read(&path)?;\n    let positions: Vec<_> = bytes.windows(5).enumerate()\n        .filter_map(|(index, value)| (value == b\"a.npy\").then_some(index))\n        .collect();\n    assert_eq!(positions.len(), 2);\n    for index in positions {\n        bytes[index] = 0x82;\n    }\n    std::fs::write(&path, bytes)?;\n    assert_tensor(&path, \"\\u{e9}\")\n}\n\n#[test]\nfn invalid_npz_is_reported_as_a_zip_error() -> Result<()> {\n    let directory = tempfile::tempdir()?;\n    let path = directory.path().join(\"invalid.npz\");\n    std::fs::write(&path, b\"not a zip archive\")?;\n    assert!(matches!(Tensor::read_npz(&path), Err(Error::Zip(_))));\n    assert!(matches!(NpzTensors::new(&path), Err(Error::Zip(_))));\n    Ok(())\n}\n\n#[test]\nfn invalid_pth_is_reported_as_a_zip_error() -> Result<()> {\n    let directory = tempfile::tempdir()?;\n    let path = directory.path().join(\"invalid.pth\");\n    std::fs::write(&path, b\"not a zip archive\")?;\n    assert!(matches!(\n        candle_core::pickle::read_pth_tensor_info(&path, false, None),\n        Err(Error::Zip(_))\n    ));\n    Ok(())\n}\n", encoding='utf-8')
          print(json.dumps({'imported_files': len(original), 'modified_upstream': changed, 'omitted': omitted}, sort_keys=True))
          PY
      - name: Generate and validate the exact dependency lock
        run: |
          set -euo pipefail
          cargo update -p candle-core -p zip
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          rustfmt --edition 2021 tests/model_zip.rs
          cargo test --locked --test model_zip
          cargo test --locked --lib models::
          cargo build --locked --example menu_probe
      - name: Capture source-bound native illustrations with the actual offline probe
        run: |
          python3 scripts/capture_menu_docs.py --refresh
          python3 scripts/source_audit.py
          python3 scripts/site.py --check
          git diff --check
      - name: Export the reviewable candidate as UTF-8 data
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path
          root = Path.cwd()
          names = ['Cargo.toml', 'Cargo.lock', 'scripts/source_audit.py', 'tests/model_zip.rs',
                   'docs/assets/menu-bar-en.svg', 'docs/assets/menu-bar-zh-CN.svg',
                   'docs/assets/menu-bar-review-manifest.json']
          names += [path.relative_to(root).as_posix() for path in (root / 'third_party/candle-core').rglob('*') if path.is_file()]
          files = {name: (root / name).read_text(encoding='utf-8') for name in sorted(names)}
          payload = json.dumps(files, ensure_ascii=True).encode('utf-8')
          assert len(payload) < 8 * 1024 * 1024
          print('MARIS_ZIP_CANDIDATE_SHA256=' + hashlib.sha256(payload).hexdigest())
          print('MARIS_ZIP_CANDIDATE_FILES=' + str(len(files)))
          print('MARIS_ZIP_CANDIDATE_BEGIN')
          encoded = base64.b64encode(payload).decode('ascii')
          for start in range(0, len(encoded), 200):
              print(encoded[start:start + 200])
          print('MARIS_ZIP_CANDIDATE_END')
          PY
