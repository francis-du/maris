name: One-time security lock refresh
on:
  push:
    branches: [fix/release-completion]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Resolve patched dependency and test vendored core
        run: |
          cargo +1.94.0 check
          cargo +1.94.0 test --manifest-path third_party/flexaudio-core/Cargo.toml
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git commit -m "Lock patched flexaudio-core ringbuf dependency"
          git push
