name: Push and PR checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned RustSec audit tool
        run: rustup run stable cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the complete lockfile including unsound dependencies
        run: rustup run stable cargo audit --deny unsound
  source-and-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Source hygiene and documentation links
        run: |
          python scripts/source_audit.py
          python scripts/site.py --check
          python -m unittest discover -s tests/tooling -v
          bash -n install.sh
          bash -n scripts/install_linux.sh
          bash -n scripts/install_macos.sh
          bash install.sh --dry-run
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Native Windows download regression
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests/tooling -p test_online.py -v
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Reject vulnerable dependencies reachable on this native target
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree --locked --edges normal)"
          if grep -Eq '(^|[[:space:]├└─])glib v0\.18\.5([[:space:]]|$)' <<< "$tree"; then
            echo "glib 0.18.5 is reachable on $RUNNER_OS; target is not release-safe" >&2
            exit 1
          fi
          if grep -Eq '(^|[[:space:]├└─])ringbuf v0\.[0-4]\.' <<< "$tree"; then
            echo "an unpatched ringbuf version is reachable on $RUNNER_OS" >&2
            exit 1
          fi
      - name: Install Linux audio build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config psmisc pulseaudio pulseaudio-utils
      - name: Formatting
        run: cargo fmt --all --check
      - name: CLI command help contract
        run: cargo test --locked --test cli
      - name: Default-feature regression tests
        run: cargo test --all-targets --locked
      - name: Minimal-feature regression tests
        run: cargo test --all-targets --no-default-features --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Exercise native menu event delivery and bounded shutdown
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: cargo run --locked --example menu_probe -- --event-loop
      - name: Execute the pinned local music model
        env:
          MARIS_BUNDLE_SMALL_MODELS: '1'
        run: |
          cargo test --locked --lib models:: -- --nocapture
      - name: Native Linux audio integration with private silent outputs
        if: runner.os == 'Linux'
        run: python3 tests/support/pulse_smoke.py --binary target/debug/maris
# Deliberately no release build, package upload, tag or publication on branch push.
