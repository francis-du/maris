name: TUI docs refresh

on:
  push:
    branches:
      - fix/tui-preset-state-20261003

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt && rustup override set 1.94.0
      - name: Install Linux audio build headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config psmisc pulseaudio pulseaudio-utils
      - name: Verify UI probe directly
        run: cargo run --locked --example ui_probe -- --locales
      - name: Regenerate actual offline Ratatui documentation illustrations
        run: python scripts/docs_assets.py --refresh
      - name: Validate generated documentation assets
        run: python scripts/docs_assets.py
      - name: Commit only reviewed generated illustrations and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              docs/assets/studio-*.svg|docs/assets/settings-*.svg|docs/assets/presets-*.svg|docs/assets/illustrations.json) ;;
              *) echo "Unexpected generated change: $path" >&2; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -ge 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/studio-*.svg docs/assets/settings-*.svg docs/assets/presets-*.svg docs/assets/illustrations.json
          git rm .github/workflows/tui-docs-refresh.yml
          git commit -m "docs: refresh TUI illustrations"
          git push origin HEAD:fix/tui-preset-state-20261003
