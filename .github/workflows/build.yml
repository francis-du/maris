name: Build application artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: 1.90.0
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Install Linux audio build headers and open-file checker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config psmisc pulseaudio pulseaudio-utils
      - name: Full non-hardware checks
        shell: bash
        run: |
          python scripts/source_audit.py
          python scripts/site.py --check
          python -m unittest discover -s tests/tooling -v
          cargo fmt --all --check
          cargo test --locked --all-targets
          cargo test --locked --all-targets --no-default-features
          cargo clippy --locked --all-targets -- -D warnings
      - name: Verify bundled semantic model and AutoEq profile pack
        env:
          MARIS_BUNDLE_SMALL_MODELS: '1'
          MARIS_BUNDLE_AUTOEQ_PROFILES: '1'
        run: |
          cargo test --locked --lib models::musicnn::tests::bundled_checkpoint_executes_end_to_end
          cargo test --locked --test autoeq bundled_profile_pack_contains_known_profile
      - name: 200 recorded offline regression rounds
        run: python scripts/verify_rounds.py --rounds 200
      - name: Build once and package explicitly local development artifacts
        run: python scripts/package.py --local
      - name: Native Linux audio integration with private silent outputs
        if: runner.os == 'Linux'
        run: python3 tests/support/pulse_smoke.py --binary target/release/maris
      - name: Validate archive and perform an isolated native install
        run: python scripts/package_smoke.py
      - name: Prepare CI-built online installation candidate (no compilation, no release)
        run: python scripts/release_bundle.py --candidate
      - name: Upload application and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maris-local-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/packages/*.zip
            dist/packages/*.tar.gz
            dist/packages/*.sha256
            dist/online-candidate/*.tar.gz
            dist/online-candidate/*.zip
            dist/online-candidate/*.release.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve verification evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}-${{ github.sha }}
          path: .maris-review/verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  assemble-candidate:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Retrieve only this successful run's six native candidate outputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'maris-local-*' --dir .maris-review/ci-kits
      - name: Validate all targets and assemble the non-public candidate manifest
        run: python scripts/release_bundle.py --collect .maris-review/ci-kits --output dist/candidate-manifest/maris-release.tsv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maris-candidate-manifest-${{ github.sha }}
          path: dist/candidate-manifest/maris-release.tsv
          if-no-files-found: error
          retention-days: 14
# Candidate manifests are rejected by normal installation. No GitHub Release is published here.
