name: Build application artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: 1.94.0
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned RustSec audit tool
        run: rustup run stable cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the complete lockfile including unsound dependencies
        run: rustup run stable cargo audit --deny unsound
  native:
    needs: dependency-audit
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Reject vulnerable dependencies reachable on this native target
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree --locked --edges normal)"
          if grep -Eq '(^|[[:space:]├└─])glib v0\.18\.5([[:space:]]|$)' <<< "$tree"; then
            echo "glib 0.18.5 is reachable on $RUNNER_OS; target is not release-safe" >&2
            exit 1
          fi
          if grep -Eq '(^|[[:space:]├└─])ringbuf v0\.[0-4]\.' <<< "$tree"; then
            echo "an unpatched ringbuf version is reachable on $RUNNER_OS" >&2
            exit 1
          fi
      - name: Install Linux audio build headers and open-file checker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config psmisc pulseaudio pulseaudio-utils
      - name: Full non-hardware checks
        shell: bash
        run: |
          python scripts/source_audit.py
          python scripts/site.py --check
          python -m unittest discover -s tests/tooling -v
          cargo fmt --all --check
          cargo test --locked --all-targets
          cargo test --locked --all-targets --no-default-features
          cargo clippy --locked --all-targets -- -D warnings
      - name: Verify bundled semantic model and AutoEq profile pack
        shell: bash
        env:
          MARIS_BUNDLE_SMALL_MODELS: '1'
          MARIS_BUNDLE_AUTOEQ_PROFILES: '1'
        run: |
          cargo test --locked --lib models::musicnn::tests::bundled_checkpoint_executes_end_to_end
          cargo test --locked --test autoeq bundled_profile_pack_contains_known_profile
      - name: Exercise native menu construction and actual item-ID dispatch
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: cargo run --locked --example menu_probe
      - name: Exercise native menu event delivery and bounded shutdown
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: cargo run --locked --example menu_probe -- --event-loop
      - name: 200 recorded offline regression rounds
        run: python scripts/verify_rounds.py --rounds 200
      - name: Build once and package the portable CLI/TUI artifacts
        run: python scripts/package.py --local --cli
      - name: Native Linux audio integration with private silent outputs
        if: runner.os == 'Linux'
        run: python3 tests/support/pulse_smoke.py --binary target/release/maris
      - name: Validate archive and perform an isolated native install
        run: python scripts/package_smoke.py
      - name: Verify the native CLI contract and prepare its release kit (no publication)
        run: python scripts/release_bundle.py --cli
      - name: Upload CLI/TUI archive and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maris-cli-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/packages/*.zip
            dist/packages/*.tar.gz
            dist/packages/*.sha256
            dist/online-approved/*.tar.gz
            dist/online-approved/*.zip
            dist/online-approved/*.release.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve verification evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.os }}-${{ github.sha }}
          path: .maris-review/verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  assemble-cli:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Retrieve only this successful run's six native CLI outputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'maris-cli-*' --dir .maris-review/ci-kits
      - name: Validate all native CLI kits and assemble the install manifest
        run: python scripts/release_bundle.py --collect .maris-review/ci-kits --output dist/cli-manifest/maris-release.tsv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maris-cli-manifest-${{ github.sha }}
          path: dist/cli-manifest/maris-release.tsv
          if-no-files-found: error
          retention-days: 14
# CLI manifests bind six exact native CI outputs. No GitHub Release is published here.
