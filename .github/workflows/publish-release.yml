name: Publish stable release

on:
  push:
    branches:
      - 'release-publish/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: stable-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    outputs:
      source_run_id: ${{ steps.validation.outputs.source_run_id }}
      source_sha: ${{ steps.validation.outputs.source_sha }}
      release_tag: ${{ steps.validation.outputs.release_tag }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source and successful preflight
        id: validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prefix='release-publish/'
          case "$GITHUB_REF_NAME" in
            "$prefix"v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Publish branch must be release-publish/vX.Y.Z" >&2; exit 1 ;;
          esac
          tag="${GITHUB_REF_NAME#$prefix}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Publish branch must end in vX.Y.Z" >&2
            exit 1
          fi
          version="${tag#v}"
          cargo_version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$cargo_version" != "$version" ]; then
            echo "Publish tag $tag does not match Cargo version $cargo_version" >&2
            exit 1
          fi

          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          if [ "$GITHUB_SHA" != "$current_main" ]; then
            echo "release-publish branch must point exactly at current main" >&2
            exit 1
          fi

          gh api --method GET "repos/$GH_REPO/actions/runs" \
            -f event=push \
            -f status=success \
            -f per_page=100 > validation-runs.json
          source_run_id="$(jq -r --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.name == "Build application artifacts"
              and .head_sha == $sha
              and (.head_branch | startswith("release-validation/")))]
              | sort_by(.created_at) | last | .id // empty' \
            validation-runs.json)"
          if [[ ! "$source_run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "No successful release-validation Build application artifacts run at $GITHUB_SHA" >&2
            exit 1
          fi

          git fetch --force --tags origin
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists" >&2
            exit 1
          fi

          {
            echo "RELEASE_TAG=$tag"
            echo "RELEASE_VERSION=$version"
          } >> "$GITHUB_ENV"
          {
            echo "source_run_id=$source_run_id"
            echo "source_sha=$GITHUB_SHA"
            echo "release_tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "main advanced after release validation; refusing stale release" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Maris $RELEASE_VERSION" \
            --generate-notes

          rollback_owned_release() {
            local tag_sha
            tag_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha' 2>/dev/null || true)"
            if [ "$tag_sha" = "$GITHUB_SHA" ]; then
              gh release delete "$RELEASE_TAG" --yes --cleanup-tag
            else
              gh release delete "$RELEASE_TAG" --yes
              echo "Release tag ownership changed; removed only the release and preserved the tag." >&2
            fi
          }

          created_tag_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha' 2>/dev/null || true)"
          if [ "$created_tag_sha" != "$GITHUB_SHA" ]; then
            rollback_owned_release
            echo "Release tag did not resolve to the validated source after creation" >&2
            exit 1
          fi

          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            rollback_owned_release
            echo "main advanced while the draft release was being created; rolled it back" >&2
            exit 1
          fi

  assets:
    needs: publish
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-assets.yml
    with:
      source_run_id: ${{ needs.publish.outputs.source_run_id }}
      source_sha: ${{ needs.publish.outputs.source_sha }}
      release_tag: ${{ needs.publish.outputs.release_tag }}

  rollback-release:
    needs: [publish, assets]
    if: always() && needs.publish.result == 'success' && needs.assets.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Remove release and tag after asset publication failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Missing owned release identity for rollback" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" >/dev/null
          tag_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha' 2>/dev/null || true)"
          if [ "$tag_sha" = "$SOURCE_SHA" ]; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          else
            gh release delete "$RELEASE_TAG" --yes
            echo "Release tag no longer belongs to this publication; preserved the tag while removing the release." >&2
            exit 1
          fi
