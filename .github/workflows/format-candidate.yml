name: Format 0.1.0 candidate

on:
  push:
    branches:
      - release/0.1.0-final

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/0.1.0-final
      - name: Install declared Rust formatter
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          rustup override set 1.94.0
      - name: Normalize Rust formatting
        run: |
          cargo fmt --all
          cargo fmt --all --check
      - name: Commit only Rust formatting and self-remove
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              *.rs) ;;
              *) echo "Unexpected formatter change: $path" >&2; exit 1 ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)**/*.rs'
          git rm .github/workflows/format-candidate.yml
          git commit -m "style: format 0.1.0 candidate"
          git push origin HEAD:release/0.1.0-final
