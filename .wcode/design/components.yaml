- schema_version: 1
  id: component:runtime
  name: Runtime and crate surface
  responsibilities:
  - Own process entry points, crate wiring, and stable public re-exports.
  implementation:
  - kind: file
    path: src/main.rs
  - kind: file
    path: src/lib.rs

- schema_version: 1
  id: component:analysis
  name: Audio analysis
  responsibilities:
  - Own spectrum and music-context analysis that executes outside the real-time callback.
  implementation:
  - kind: file
    path: src/analysis/mod.rs
  - kind: file
    path: src/analysis/context.rs
  - kind: file
    path: src/analysis/spectrum.rs

