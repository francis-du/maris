- schema_version: 1
  id: component:dsp
  name: Deterministic DSP
  responsibilities:
  - Own music processing, profiles, resampling, tone shaping, safety headroom, and deterministic render math.
  depends_on:
  - component:analysis
  constraints:
  - MARIS-AUDIO-REALTIME
  implementation:
  - kind: file
    path: src/dsp/mod.rs
  - kind: file
    path: src/dsp/music.rs
  - kind: file
    path: src/dsp/profile.rs
  - kind: file
    path: src/dsp/resample.rs
  - kind: file
    path: src/dsp/tone.rs

- schema_version: 1
  id: component:devices
  name: Device identity and correction
  responsibilities:
  - Own stable device identity, capabilities, and correction matching.
  implementation:
  - kind: file
    path: src/devices/mod.rs
  - kind: file
    path: src/devices/autoeq.rs
  - kind: file
    path: src/devices/capability.rs
  - kind: file
    path: src/devices/identity.rs

- schema_version: 1
  id: component:tuning
  name: Listening preferences and planner
  responsibilities:
  - Own reversible listening preferences, EQ state, constrained proposals, and device-specific tuning.
  depends_on:
  - component:devices
  - component:analysis
  implementation:
  - kind: file
    path: src/tuning/mod.rs
  - kind: file
    path: src/tuning/eq.rs
  - kind: file
    path: src/tuning/planner.rs
  - kind: file
    path: src/tuning/preferences.rs

- schema_version: 1
  id: component:mixer
  name: Mixer
  responsibilities:
  - Own multi-input mixer state, bus routing, and matrix math.
  - Check revisions for channel edits and scene save/restore; scene saves preserve audio undo.
  implementation:
  - kind: file
    path: src/mixer/mod.rs
  - kind: file
    path: src/mixer/engine.rs

- schema_version: 1
  id: component:models
  name: Local model runtime
  responsibilities:
  - Own admitted local model assets, preprocessing, and non-real-time inference boundaries.
  depends_on:
  - component:analysis
  implementation:
  - kind: file
    path: src/models/mod.rs
  - kind: file
    path: src/models/musicnn.rs
  - kind: file
    path: src/models/musicnn_preprocess.rs

- schema_version: 1
  id: component:presets
  name: Presets and scenes
  responsibilities:
  - Own bounded listening presets and scene catalogs without changing measured correction semantics.
  depends_on:
  - component:tuning
  implementation:
  - kind: file
    path: src/presets/mod.rs
  - kind: file
    path: src/presets/scenes.rs

- schema_version: 1
  id: component:control
  name: Commands and saved settings
  responsibilities:
  - Own validated commands, persisted state, and MCP control surfaces.
  depends_on:
  - component:tuning
  - component:mixer
  - component:audio
  implementation:
  - kind: file
    path: src/control/mod.rs
  - kind: file
    path: src/control/mcp.rs
  - kind: file
    path: src/control/store.rs

- schema_version: 1
  id: component:i18n
