schema_version: 1
id: product:maris
name: Maris
vision: Improve music playback on the user's current audio devices through transparent, reversible, device-aware DSP and shared app, TUI, CLI, and MCP controls.
principles:
- Music quality and transparent signal handling take priority over effect count or loudness.
- Commercial convergence prioritizes reliable playback, useful reversible tuning and a short customer workflow. docs/development/models.md defines model admission; docs/development/product-gates.md separates implemented features from release acceptance. Normal inventory and UI exclude unintegrated candidates, research-only downloads and placeholder model claims. A new built-in model requires exact asset permissions, runtime evidence and incremental benefit against the current DSP baseline; classifier labels alone are not sound-quality evidence.
- Device correction, listening preference, speech enhancement, and mixing remain distinct capabilities.
- Real-time audio processing never depends on network calls, model latency, file I/O, or blocking control operations.
- UI telemetry reflects real engine state; unavailable capabilities are shown as unavailable rather than simulated.
- Programme loudness and true peak are analysis evidence; they are not mislabeled as output normalization or true-peak limiting.
- Neural music analysis runs only on non-real-time workers and produces structured context or parameter proposals; deterministic DSP renders audio. MusicNN uses the pinned, SHA-256-verified small checkpoint embedded by the release build and native Candle CPU inference; signal-only fallback leaves semantic fields empty when the bundled backend is absent or fails. Normal product use never downloads MusicNN or executes remote custom code. Larger future models may be optional downloads only after license, hash, runtime and incremental-benefit review.
- >-
  The default TUI is one listening workstation: a dominant shared-frequency analyzer with separately labeled pre-EQ spectrum and calculated profile-EQ scales, a fixed device/listening-control rail, docked stereo output meters, quiet music-context/AI support and mixer/health summaries. Optional detail views never become mandatory pages for daily listening. docs/development/ui-design.md records the professional-audio reference study and visual review gates. Risky route changes never occur merely from opening or cycling a picker; Enter is required to apply. Unavailable data remains explicit and no decorative fake telemetry is allowed.
- Maris may pin its own native render stream to a physical endpoint without changing the OS default; disappearing pinned outputs fall back to the current system default and rebind device-specific tuning. New physical-output pipelines start from correction-preserving neutral preferences and crossfade into the device's saved subjective target instead of exposing the full tonal target instantaneously.
- Stable platform device identifiers are preferred for preference identity when available; display-name fallback is explicit and same-named stable devices must not silently share a profile.
- >-
  macOS, Windows and Linux may process explicitly selected applications through their native capture paths. Independent mixer strips use the same bounded gain, EQ, compression, optional speech-only denoise, routing and undo model. Native route replacement is explicit and reversible: teardown restores the prior route or session state rather than changing the OS default output or volume scalar.
- App, TUI, CLI, and MCP use the same validated state model and safety boundaries. Studio pointer targets share rendered geometry and dispatch through the keyboard revision/undo path; wheel movement only selects, overlays and compact mode block hidden pointer edits, and applied badges require both callback revision counters.
- Advanced controls open in-place inspectors from a visible direct-action row and section-title clicks. E/M/V/I/H reach EQ/Apps/Device/Listening-Assist/Health in one action; Esc returns home. Tab is optional. EQ and Dashboard preserve separate cursors, band selection never changes gain, and application checkboxes edit pending scope only until explicit apply. Inspector presentation shares the Studio rail, palette and evidence boundaries.
- Listening Assist is goal-preview-compare-undo, not a model catalog. UI and live planning share fresh complete sample-rate-matched evidence checks; semantic hints require an available runtime, final constrained deltas and explanations are verified on apply, and no-ops preserve revision/undo. Compression remains an explicit preference rather than a hidden response to already compressed audio.
- Localization is a presentation boundary for all six supported locales, including state values, confirmations, notices, scene names and planner explanations. Machine fields and user device names remain unchanged. Deferred named-template notices re-render in the active locale; UI-thread preference watchers and explicit child-process locale propagation keep consoles and menus consistent. Unknown OS/library diagnostics retain original technical causes. No locale operation enters an audio callback.
- Listening scenes are bounded preference combinations, not measured correction or implicit speech denoising. The P picker applies scenes explicitly without requiring another tab. Scenes share listening revision/undo and device constraints across TUI/CLI/MCP, preserve correction/high-pass/balance/comparison policy, and keep the original EQ catalog and state separate. Virtual 360/Cinema 360/Stereo Focus are effect-only scenes: they preserve unrelated tone/dynamics state, operate on stereo Side rather than multichannel objects, and remain bounded by the final limiter. New night-dialogue compression is clearly labeled; small-speaker virtual bass needs known device limits.
- >-
  Menu Bar is a direct listening remote: enabled stable-output and grouped-preset selections apply in the menu event after rechecking session/output identity, binding, capability and revisions; there is no second confirmation dialog or pending Apply/Cancel state. Current-device preset and global EQ labels remain separate, and callback revisions determine Applied versus Pending. Root A/B changes share the listening validator without consuming tonal undo; scoped undo cannot revert another device. Language changes and retained errors are presentation-only. Native menu construction and controller tests do not establish real-device audio behavior.
- Misoperation resistance is a control-plane invariant, not extra setup pages. Frozen picker context invalidates on device/rate/revision changes and stale dialogs remain modal until cancellation. Immediate menu actions match their rendered context. Discrete repeats do not become repeated confirmations, exact no-ops preserve history, and competing route producers cannot silently overwrite a pending request. Explicit null is required for system-default routing; malformed actions and revision guards fail as controls without stopping healthy audio. Global bypass labels reflect its actual music-reference behavior. All mechanisms remain outside callbacks.
- >-
  Preference actions follow visible state: decreasing an off amount is a no-op and its first upward step is 10%, not a hidden cached amount. Capability-disallowed Bass Assist activation fails explicitly. ui/tui/actions owns tested console mutation outcomes; only a changed transaction can redirect the undo domain or rename a curve. listening::edit_if_changed skips implicit materialization while explicit SaveDevice remains supported. Scoped undo restores one endpoint and preserves unrelated A/B state; real unrelated tuning changes still invalidate it. Implicit CLI writes require fresh identified output telemetry; explicit default/named offline edits remain available, and empty parameter commands fail without activation.
- Sound settings is a draft-first configuration page rather than a live mixed-control grid. Its grouped This-output/Global-EQ browser has no mutation targets; arrows and wheel only select. A fixed Current/Draft station stages +/- and sample-rate-aware Q through shared pure adjustment functions. Apply commits one existing revision/undo namespace after frozen identity/capability/revision validation; Cancel and no-ops never write settings. Pending drafts retain their captured target, block unrelated navigation/routing/presets/A-B/undo, invalidate permanently on context drift, and cannot apply through compact mode. Fixed separated Apply/Cancel targets, localized deltas and actual reducer/geometry/renderer tests are required; callback DSP and machine schemas remain unchanged.
- Configuration rendering/input are decomposed into ui/tui/settings/view and ui/tui/settings/input. Device tone, global EQ and playback switches are one-action local sections with stable visible row positions; arrows never navigate across section boundaries into a dangerous switch. Playback policy is explicit OFF/ON and not silently changed by tone edits or configuration-header comparison. Mouse Apply requires matching press/release against the same draft generation and geometry; drag, keyboard, resize and invalidation cancel the gesture. All 28 controls remain available, including Virtual 360 and Stereo Focus amounts, and all presentation/warning strings cover six locales.
- Delivery tooling separates source publication, manual local application artifacts, Pages documentation and public release. Offline installation is normal-user, no-autostart, identity/architecture/signature-aware, symlink-rejecting and backup/rollback-capable; no driver, OS-volume/default-output, login-item, PATH or quarantine changes occur. Source auditing excludes generated/user/agent state and credentials. A source-bound 200-round seeded offline matrix uses bounded independent processes with isolated test state and records exact logs without claiming independent audit or hardware/listening acceptance. Failed cases stop new batches; interrupted runs are never counted as complete. Release acceptance binds both the source and the final reviewed bundle digest. Release preflight requires explicit evidence and signed/notarized bundle verification; missing gates block publication. Documentation and tooling tests do not change audio callbacks.
- Native menu events wake the UI loop and share one item-ID dispatcher; macOS/Windows selections show immediate explicit review with safe cancellation, while Linux retains the in-menu fallback. Own-transaction acknowledgements keep rapid actions usable without accepting unseen external edits. Terminal motion is coalesced without dropping input edges; real owned pseudo-terminal tests retain a session lease so they never start capture.
- Cross-platform installers and artifacts validate native identity, preserve unrelated files and previous versions, and never activate audio or alter OS settings. macOS, Linux and Windows native x86_64/ARM64 jobs are separate; declared matrices do not count as executed evidence. Source-only publication, local artifact builds, Pages deployment and approved binary releases remain separate gates. Public release cannot be manufactured by a 200-round report.
- Feature ablation uses actual Processor output under documented generated conditions; contribution metrics do not score listening preference. Safety headroom and limiting remain invariants, working DSP and compatibility APIs remain preserved, and no feature is kept merely to increase effect or model count.
- Normal installation downloads a precompiled approved GitHub CI release; it never implicitly compiles or requires a Rust toolchain. Standalone Bash/PowerShell bootstraps resolve a bounded release manifest once, pin subsequent downloads to that version, enforce HTTPS/time/size/archive/binary checks and pass verified payloads to the existing per-user transactional installers. Local --from and explicit developer --build remain separate. Unpublished, candidate, malformed or corrupt releases fail without fallback, OS changes or audio activation. CI build kits remain candidate until native signature/acceptance gates and every prior user requirement are complete.
- Online installation retries complete transfers into fresh private files, never concatenating partially downloaded retry responses. Release collection inspects actual bounded TAR/ZIP contents, embedded version/target/source and executable bytes, rejects case aliases and unsafe entries, and binds all six targets to one CI run/commit/repository plus the checked-out source. A descriptor or recomputed outer hash is not proof of payload identity. Native packaging owns one optimized build; kit assembly never rebuilds. macOS native archives include wrapper-prefixed contents rather than out-of-root wrapper metadata, retaining payload metadata without stripping security attributes or loosening path checks; native metadata round-trip tests stay in isolated temporary paths. Candidate validation and transport fixtures do not establish a published stable installation or hardware acceptance.
- Detailed Markdown is maintained in docs/reference and docs/development, customer pages in six locale directories. README and AGENTS remain root entry points. Website illustration/brand assets, source paths, installer notice inputs, test contracts and Pages generation must stay synchronized; a partial documentation migration is not a passing build. The original Maris logo and an accurate online-install README are explicit release requirements.
- Foreground verification may use bounded resumable batches when the execution host cannot run a long command. Resume revalidates source, compiled binary hashes and every retained seed/step/log. Partial batches never set passed=true and cannot satisfy the release gate; failed/corrupt evidence and stale locks are not silently discarded. Exactly the originally requested distinct rounds must finish on the same source before completion is reported.
- Platform-specific capabilities are reported honestly and require real-device validation before compatibility claims.
- All maintained Rust files, including tests and vendored sources, stay below 1000 lines. Source-layout CI checks src, tests and third_party without exemptions. gemm-common architecture implementations live in src/simd, complex microkernel macros in src/microkernel and dispatch macros in src/gemm; public exports and runtime detection remain unchanged. Audio stereo quality and startup cases live in tests/audio_quality/stereo.rs and tests/unit/output_startup.rs.
- Source is organized into normal Rust modules. src/main.rs delegates to src/cli; src/lib.rs declares the domain modules and preserves existing public paths through re-exports only. src/audio owns stream lifetimes and native backends; src/dsp owns processing; src/analysis owns measurements and context workers; src/devices owns device identity and correction matching; src/tuning owns preferences and proposals; src/mixer owns mixer state and matrix math; src/models owns model code; src/presets owns catalogs; src/control owns commands, persistence and MCP; src/i18n owns translations.
- Presentation lives under src/ui. src/ui/tui/settings owns configuration drafts and pointer confirmation; src/ui/tui/studio owns dashboard geometry and controls; src/ui/desktop separates process lifecycle, native menu construction, control actions and the compact monitor. New internal code uses these domain paths rather than legacy root aliases.
- Moving modules must preserve current uncommitted work, public types, preset IDs and machine fields. Source-layout tests reject flat root implementations, unreferenced module files, duplicate module ownership and presentation or transport imports in DSP math. File includes, offline illustration source bindings, architecture documentation and these constraints are updated in the same change; a directory refactor is not hardware acceptance.
- Linux pulse-server audio lives in src/audio/pulse. It connects only to the current user's local Unix socket, creates owned temporary sinks and moves eligible playback streams without changing default devices or volume. Separate capture/playback workers carry PCM through the shared Rust Renderer. Stream identity and per-route write-ahead records protect restoration against reused IDs and user edits. PipeWire installations are supported through their PulseAudio compatibility service; direct PipeWire-only clients are outside this backend. Windows uses the separate WASAPI process-loopback backend in src/audio/windows.
- Pulse graph subscriptions coalesce routing events and ignore discovery-client churn. Default/flat-volume checks precede routing; module ownership is checked before recovery moves. The worker stays unarmed during monitor preroll and shares the existing startup/stop envelopes. General CPAL device IDs remain available for explicit run/play, while system-console selectors use server outputs. Native Linux CI uses a private server with silent nodes, not the user's device or microphone, and must pass independently of protocol fixtures.
- Native platform work takes priority over documentation polish. Protocol fixtures and shared-renderer tests are not headphone listening evidence. Local full verification, documentation and installation usability block the authorized source push; native CI execution, real-device checks and publisher evidence remain mandatory before a public application release.
- Documentation describes tasks, controls, supported behavior and known limitations in ordinary language. Keep standard audio/programming terms; remove promotional slogans, invented terminology and repeated self-assurance. User-facing pages and commands use the same six-language structure. Read the current source before changing technical statements.
- Finish the documentation and website update and simplify installation instructions before the authorized interim source commit/push. Pages serves exact copies of the root installation scripts, not separately maintained launchers. Downloads must succeed before scripts run. Preserve package verification, existing install confirmation, and explicit developer-only build mode. Retired cargo-run wrappers are not distribution entry points. The staged tree must match the audited worktree; no tag or application release is authorized by this source update.
