[package]
name = "maris"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Local system audio processing with device correction, mixing, TUI, CLI and MCP controls"
publish = false

[workspace]

[features]
default = ["neural", "desktop"]
neural = ["dep:nnnoiseless"]
desktop = ["dep:tray-icon", "dep:winit"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2.2"
ratatui = "0.30.2"
crossterm = "0.29"
cpal = "0.17.1"
crossbeam-queue = "0.3"
ctrlc = { version = "3", features = ["termination"] }
directories = "6"
fs2 = "0.4"
hound = "3.5"

tempfile = "3"
rustfft = "6"
ebur128 = "0.1.10"
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
sha2 = "0.11"
nnnoiseless = { version = "=0.5.2", default-features = false, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26", default-features = false, optional = true }
winit = { version = "0.30.13", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
flexaudio = "=0.2.0"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Variant"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Level-triggered polling keeps unread terminal bytes ready after a bounded read.
crossterm = { version = "0.29", features = ["use-dev-tty"] }

[build-dependencies]
hex = "0.4"
ureq = "3.4.2"
sha2 = "0.11"

[dev-dependencies]
hex = "0.4"

[[example]]
name = "ui_probe"
path = "tests/support/ui_probe.rs"
required-features = ["desktop"]

[[example]]
name = "engine_probe"
path = "tests/support/engine_probe.rs"
required-features = ["neural"]

[[example]]
name = "menu_probe"
path = "tests/support/menu_probe.rs"
required-features = ["desktop"]

[patch.crates-io]
gemm-common = { path = "third_party/gemm-common" }
flexaudio-core = { path = "third_party/flexaudio-core" }

[profile.release]
lto = "thin"
codegen-units = 1
